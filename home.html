<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahesh Memories</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#000;
color:white;
text-align:center;
}

.hero{
padding-top:80px;
}

.hero h1{
font-size:55px;
color:red;
animation:fade 2s infinite alternate;
}

.hero h2{
font-size:35px;
margin-top:20px;
}

.hero p{
font-size:22px;
margin-top:20px;
color:#ccc;
}

button{
margin-top:40px;
padding:18px 45px;
font-size:22px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
background:#ff3333;
}

@keyframes fade{

from{
opacity:.3;
}

to{
opacity:1;
}

}
</style>

</head>

<body>

<div class="hero">

<h1>📸 Welcome To Mahesh Memories Album</h1>

<h2>My Name Is Mahesh ❤️</h2>

<p>Beautiful Memories From 2001 To 2026</p>

<button onclick="window.location='gallery.html'">
📷 View Photos
</button>

</div>

</body>
</html>
